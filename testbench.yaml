laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Alumkit\Alumkit\AlumkitServiceProvider

migrations:
  - database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - { 'db:seed': { '--class': 'Workbench\Database\Seeders\DatabaseSeeder' } }
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
